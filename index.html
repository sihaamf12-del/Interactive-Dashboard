<!DOCTYPE html>
<html lang="en">
<head>
     <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>My Interactive Dashboard</h1>
    <p>This dashboard was created by Sihaam for the WEB-115 course at Wake Tech!</p>
    <link rel="stylesheet" href="css/style.css">
    <script>
        document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites.");
    </script>
    <noscript>
        <p>The noscript is for web browsers with JavaScript rendering disabled.</p>
    </noscript>
    <div class="container">
        <div class="row">
            <!-- Dashboard Content -->
             <div class= "col" id= "metric-converter">
                <form>
                    <input type="number" id="value" placeholder="Please enter a number">
                    <select name="pick-type">
                        <option value="In to Cm">Inch to Centimeter</option>
                        <option value="Ft to Cm">Foot to Centimeter</option>
                        <option value="Yd to M">Yard to Meter</option>
                        <option value="Mi to Km">Mile to Kilometer</option>
                        <option value="Cm to In">Centimeter to Inch</option>
                        <option value="Cm to Ft">Centimeter to Foot</option>
                        <option value="M to Yd">Meter to Yard</option>
                        <option value="Km to Mi">Kilometer to Mile</option>
                    </select>
                    <button type="submit" id="submit-btn">Convert</button>
                </form>
                <div id="result"></div>
                <script src="js/metric-converter.js" defer></script>
             </div>
             <div class = "col" id = "weekly-tasks">
                <script src="js/task-manager.js" defer></script>

                <form>

                    <label for="user-name">Name:</label>
                    <input type="text" id="user-name" name="userName" required>

                    <label for="daily-goal">Daily Task Goal:</label>
                    <input type="number" id="daily-goal" name="dailyGoal" min="0" required>

                    <label for="weekly-bonus">Weekly Bonus Tasks:</label>
                    <input type="number" id="bonus-tasks" name="bonusTasks" min="0" required>

                    <button type="button" id = "goal-btn">Submit Here</button>
                    
                </form>
                
                <p id="goal-message"></p>

             </div>
        </div>
    </div>
</body>
</html>
